<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Vocabulary Cards</title>
    <style>
      /* Self-contained on purpose: this page is also the artifact that gets
         saved as a standalone .html file, so no external stylesheet. */
      :root {
        --ink: #2f2a26;
        --ink-soft: #7a6a5d;
        --line: #e6d3c4;
        --band: #f4a26a;
        --band-soft: #f9d5bd;
        --stripe: #fdeade;
        --frame: #f0b98d;
      }

      * { box-sizing: border-box; }

      html { background: #f6f4f1; }

      body {
        margin: 0;
        padding: 24px 16px 60px;
        font-family: "Helvetica Neue", Helvetica, Arial,
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        color: var(--ink);
      }

      /* ---------- toolbar (screen only) ---------- */
      .toolbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 900px;
        margin: 0 auto 20px;
        padding: 10px 14px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 999px;
        box-shadow: 0 2px 10px rgba(47, 42, 38, 0.06);
      }

      .toolbar-title {
        font-size: 13px;
        font-weight: 700;
        margin-right: auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .toolbar-hint {
        font-size: 11.5px;
        color: var(--ink-soft);
      }

      .btn {
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        padding: 7px 15px;
        border-radius: 999px;
        border: 1px solid var(--frame);
        background: #fff;
        color: #c1663a;
        cursor: pointer;
        white-space: nowrap;
      }

      .btn:hover { background: #fdf1e8; }

      .btn.primary {
        background: var(--band);
        border-color: var(--band);
        color: #fff;
      }

      .btn.primary:hover { background: #ec9257; }

      /* ---------- sheet ---------- */
      .sheet {
        width: 210mm;
        min-height: 297mm;
        margin: 0 auto 24px;
        padding: 14mm 12mm;
        background: #fff;
        box-shadow: 0 2px 14px rgba(47, 42, 38, 0.08);
      }

      .sheet-head {
        display: flex;
        align-items: flex-end;
        gap: 14px;
        margin-bottom: 10px;
      }

      .sheet-head-left { min-width: 0; }

      .sheet-head-right {
        margin-left: auto;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 4px;
      }

      .sheet-title {
        font-size: 15px;
        font-weight: 700;
        line-height: 1.35;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      .sheet-date {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 6px;
        color: var(--ink-soft);
      }

      .cal {
        width: 13px;
        height: 13px;
        flex: none;
      }

      .sheet-tag {
        font-size: 10.5px;
        font-weight: 600;
        color: #6b4a35;
        padding: 4px 10px;
        border: 1px solid var(--frame);
        border-radius: 6px;
        white-space: nowrap;
      }

      .sheet-meta {
        text-align: right;
        font-size: 10.5px;
        color: var(--ink-soft);
        white-space: nowrap;
        line-height: 1.6;
      }

      .sheet-blank {
        display: inline-block;
        min-width: 120px;
        border-bottom: 1px solid var(--line);
      }

      /* One table, both halves. The center divider is the left border of the
         second half's first column, so the two halves cannot drift apart. */
      .grid {
        width: 100%;
        border: 1.5px solid var(--frame);
        border-radius: 8px;
        border-collapse: separate;
        border-spacing: 0;
        overflow: hidden;
        table-layout: fixed;
      }

      th {
        background: var(--band-soft);
        font-size: 11px;
        font-weight: 700;
        text-align: left;
        padding: 7px 10px;
        color: #6b4a35;
      }

      th.c-word { background: var(--band); color: #fff; }

      td {
        padding: 8px 10px;
        font-size: 11.5px;
        line-height: 1.5;
        vertical-align: middle;
        border-right: 1px dashed var(--line);
      }

      td:last-child, th:last-child { border-right: 0; }

      tbody tr:nth-child(even) td { background: var(--stripe); }

      tbody tr:nth-child(even) .c-word { background: #fbdfcd; }

      .half-2 { border-left: 2.5px dashed #cfc4bb; }

      .c-idx {
        width: 3.5%;
        text-align: right;
        color: var(--ink-soft);
        font-size: 10.5px;
      }
      .c-word { width: 14%; font-weight: 700; font-size: 12.5px; }
      .c-meaning { width: 28.5%; }
      .c-check { width: 4%; }

      .box {
        display: block;
        width: 11px;
        height: 11px;
        margin: 0 auto;
        border: 1px solid #cbbdb1;
        border-radius: 2px;
      }

      .meaning-line + .meaning-line { margin-top: 1px; }

      .empty {
        max-width: 900px;
        margin: 0 auto;
        padding: 40px;
        text-align: center;
        color: var(--ink-soft);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
      }

      @page {
        size: A4 portrait;
        margin: 11.5mm;
      }

      @media print {
        html, body { background: #fff; }
        body { padding: 0; }
        .toolbar { display: none !important; }
        .sheet {
          width: auto;
          min-height: 0;
          margin: 0;
          /* 0.5mm 的余量：表格右框线若正好压在页面内容区边缘，会被打印裁掉半条 */
          padding: 0 0.5mm;
          box-shadow: none;
          page-break-after: always;
        }
        .sheet:last-of-type { page-break-after: auto; }
        tr { page-break-inside: avoid; }
      }
    </style>
  </head>
  <body>
    <div class="toolbar" id="toolbar">
      <span class="toolbar-title" id="toolbarTitle">Vocabulary Cards</span>
      <span class="toolbar-hint" id="toolbarHint"></span>
      <button class="btn" id="downloadBtn" type="button">下载 HTML</button>
      <button class="btn primary" id="printBtn" type="button">打印 / 存为 PDF</button>
    </div>
    <main id="sheets"></main>
    <script src="vocab-cards.js"></script>
  </body>
</html>
